name: Season entry
# Hosted challenge evaluation. Entrants open PRs that add one file under
# season/entries/; this workflow validates the entry, scores it on withheld
# cases with the season salt, and commits the result plus the regenerated
# public board. pull_request_target runs this file from the base branch, so the
# fork's code is never checked out or executed — the submission is fetched as
# data through the GitHub API, pinned to the PR head SHA.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["season/entries/**"]

permissions:
  contents: read

# Entries are serialized globally so the committed results directory is a
# race-free ledger: each entry's ordinal and quota check see every prior commit.
concurrency:
  group: season-eval
  cancel-in-progress: false

env:
  SEASON: season-0003
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  # Repository context for every `gh pr` call — no checkout exists yet.
  GH_REPO: ${{ github.repository }}
  ENTRY_LIMIT: "65536"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # The season salt is an environment secret; admission is automated and no
    # human approves entries.
    environment: season-eval
    steps:
      # 1. ADMIT — cheap checks before any build work. admit.env values are
      #    %q-quoted so sourcing them later can never split or execute.
      - name: Admit entry
        id: admit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/season-stage"
          mkdir -p "$STAGE"
          cd "$STAGE"
          reject() { printf 'kind=%q\n' invalid >> admit.env; printf 'reason=%q\n' "$1" >> admit.env; echo kind=invalid >> "$GITHUB_OUTPUT"; exit 0; }
          # REST pull object: .base.ref, .draft, .changed_files, .head.sha,
          # .user.login, .head.repo.full_name all in one trusted shape.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
            --jq '.[] | [.filename, .status] | @tsv' > files.tsv
          # A PR that edits this workflow runs it despite the paths filter;
          # a diff with nothing under season/entries/ is not an entry at all.
          grep -q '^season/entries/' files.tsv || { printf 'kind=%q\n' skip >> admit.env; echo kind=skip >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$(jq -r '.base.ref' pr.json)" = "main" ] || reject "Entries target the main branch."
          [ "$(jq -r '.draft' pr.json)" = "false" ] || reject "Draft PRs are not scored."
          login="$(jq -r '.user.login' pr.json | tr 'A-Z' 'a-z')"
          [ "$(wc -l < files.tsv | tr -d ' ')" = "1" ] && [ "$(jq -r '.changed_files' pr.json)" = "1" ] \
            || reject "PRs must add exactly one file under season/entries/."
          status="$(cut -f2 files.tsv)"
          path="$(cut -f1 files.tsv)"
          [ "$status" = "added" ] || reject "Entry files must be new additions, not edits."
          case "$path" in
            season/entries/"$login"-[0-9]*.json) : ;;
            *) reject "Path must be season/entries/<your-login>-<n>.json." ;;
          esac
          echo "$path" | grep -Eq "^season/entries/[a-z0-9-]+-[0-9]+\.json$" \
            || reject "Entry filename must be <login>-<n>.json."
          printf 'kind=%q\n' entry >> admit.env
          printf 'login=%q\n' "$login" >> admit.env
          printf 'entry_path=%q\n' "$path" >> admit.env
          printf 'head_sha=%q\n' "$(jq -r '.head.sha' pr.json)" >> admit.env
          printf 'head_repo=%q\n' "$(jq -r '.head.repo.full_name' pr.json)" >> admit.env
          echo kind=entry >> "$GITHUB_OUTPUT"

      - name: Reject inadmissible pull request
        if: ${{ always() && steps.admit.outputs.kind != 'entry' && steps.admit.outputs.kind != 'skip' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/season-stage"
          kind=invalid; reason="Admission did not run."
          [ -f admit.env ] && . ./admit.env
          [ "$kind" = "entry" ] && exit 0
          printf 'Entry not admitted: %s\n\nOnly `season/entries/<login>-<n>.json` additions are scored; see [the hosted seasons doc](https://platonik.space/docs/seasons).\n' "$reason" > report.md
          gh pr comment "$PR" --body-file report.md || true
          gh pr edit "$PR" --add-label season-invalid || true
          gh pr close "$PR" || true
          touch report.done
          echo "Entry rejected: $reason"
          exit 1

      # 2. FETCH — the submission is data: one file, pinned to the head SHA.
      #    The fork's ref name is never used, and nothing from the PR is checked
      #    out or executed.
      - name: Fetch entry file
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/season-stage"
          . ./admit.env
          gh api "repos/${head_repo}/contents/${entry_path}?ref=${head_sha}" \
            -H 'Accept: application/vnd.github.raw+json' > entry.json
          bytes="$(wc -c < entry.json | tr -d ' ')"
          [ "$bytes" -le "$ENTRY_LIMIT" ] || {
            echo "Entry exceeds the 64 KiB input limit." > report.md
            gh pr comment "$PR" --body-file report.md || true
            gh pr close "$PR" || true
            touch report.done
            exit 1
          }
          # Identity is bound by the workflow, not the file: the entrant is the
          # GitHub account that opened the PR.
          jq --arg name "github:$login" '.agent = ((.agent // {}) + {name: $name})' entry.json > submission.json
          rm entry.json
          # The bound copy is what the CLI reads — enforce the input limit on it.
          [ "$(wc -c < submission.json | tr -d ' ')" -le "$ENTRY_LIMIT" ] || {
            echo "Entry exceeds the 64 KiB input limit." > report.md
            gh pr comment "$PR" --body-file report.md || true
            gh pr close "$PR" || true
            touch report.done
            exit 1
          }

      # 3. BASE CHECKOUT — trusted tree only, for the toolchain and the ledger.
      #    Actions are SHA-pinned: this workflow is privileged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        with:
          ref: main
          persist-credentials: false

      - name: Restore staged entry artifacts
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        run: cp -a "$RUNNER_TEMP/season-stage"/. .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        with:
          bun-version: '1.3.14'
      - name: Install toolchain
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        with:
          save-if: false
      - name: Build evaluator
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        run: |
          cargo build --locked -p platonik-cli
          bun install --frozen-lockfile

      # 4. QUOTA + DEDUP — committed results are the authoritative count.
      - name: Check season admission
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          . ./admit.env
          mkdir -p "season/results/$SEASON"
          code=0
          ./target/debug/platonik season admit "seasons/$SEASON.json" "season/results/$SEASON" submission.json > admission.json 2> admit.err || code=$?
          if [ "$code" -gt 1 ]; then
            # Parse/schema failures are invalid entries, not evaluator faults.
            reason="$(jq -r '.error.message // empty' admit.err 2>/dev/null || true)"
            [ -n "$reason" ] || reason="Entry is not a readable submission."
            printf 'Entry not admitted: %s\n' "$reason" > report.md
            gh pr comment "$PR" --body-file report.md || true
            gh pr edit "$PR" --add-label season-invalid || true
            gh pr close "$PR" || true
            touch report.done
            exit 1
          fi
          cat admission.json
          if [ "$(jq -r '.admitted' admission.json)" != "true" ]; then
            reason="$(jq -r '.reason // "Entry refused."' admission.json)"
            printf 'Entry not admitted: %s\n' "$reason" > report.md
            gh pr comment "$PR" --body-file report.md || true
            case "$reason" in
              *uplicate*) gh pr edit "$PR" --add-label season-duplicate || true ;;
              *quota*)    gh pr edit "$PR" --add-label season-quota-exceeded || true ;;
              *)          gh pr edit "$PR" --add-label season-invalid || true ;;
            esac
            gh pr close "$PR" || true
            touch report.done
            exit 1
          fi
          printf 'seq=%q\n' "$(jq -r '.entry' admission.json)" >> admit.env

      # 5. EVAL — withheld cases keyed to (salt, entrant, challenge, entry).
      - name: Score entry
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        env:
          SEASON_SALT: ${{ secrets.SEASON_SALT_0003 }}
        run: |
          set -euo pipefail
          trap 'rm -f salt.txt' EXIT
          . ./admit.env
          umask 077
          printf '%s' "$SEASON_SALT" > salt.txt
          code=0
          ./target/debug/platonik season eval "seasons/$SEASON.json" submission.json "$seq" --salt salt.txt > result.json || code=$?
          [ "$code" -le 1 ] || { [ -f result.json ] && cat result.json > /dev/stderr; exit 1; }
          # Self-verify before publishing: full derivation + replay with salt.
          ./target/debug/platonik season verify "seasons/$SEASON.json" result.json --salt salt.txt > verify.json
          jq -e '.verified == true' verify.json

      # 6. COMMIT — result + canonical entry + regenerated public board. main
      #    requires the aggregate check for everyone else; the publish push runs
      #    over SSH with the repo's season deploy key, the ruleset bypass actor.
      - name: Publish result
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEASON_DEPLOY_KEY: ${{ secrets.SEASON_DEPLOY_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/season-key"; git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          . ./admit.env
          umask 077
          printf '%s\n' "$SEASON_DEPLOY_KEY" > "$RUNNER_TEMP/season-key"
          gh api meta --jq '.ssh_keys[] | "github.com \(.)"' > "$RUNNER_TEMP/known-hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/season-key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known-hosts -o StrictHostKeyChecking=yes"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config user.name "platonik-season[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "season/results/$SEASON" "season/entries/$SEASON"
          cp submission.json "season/entries/$SEASON/${login}-${seq}.json"
          cp result.json "season/results/$SEASON/${login}-${seq}.json"
          bun scripts/record-season.ts "$SEASON" --write
          git add "season/entries/$SEASON" "season/results/$SEASON" "public/season/$SEASON.json"
          git commit -m "season: $SEASON entry $seq for $login (pr #$PR, ${head_sha:0:12})"
          pushed=""
          for attempt in 1 2 3; do
            git rebase --abort >/dev/null 2>&1 || true
            if git fetch origin main && git rebase "origin/main" && git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep 3
          done
          [ -n "$pushed" ] || { echo "Could not publish the result to main." > /dev/stderr; exit 1; }
          # Re-check the pushed state: board regeneration must reproduce exactly.
          bun scripts/record-season.ts "$SEASON" --check

      # 7. REPORT — honest outcome on the PR; the PR is the entry's audit trail.
      - name: Report outcome
        if: ${{ steps.admit.outputs.kind == 'entry' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          . ./admit.env
          challenge="$(jq -r '.result.challenge' result.json)"
          passed="$(jq -r '.result.cases_passed' result.json)"
          total="$(jq -r '.result.cases_total' result.json)"
          work="$(jq -r '.result.total_work' result.json)"
          bytes="$(jq -r '.result.program_bytes' result.json)"
          hash="$(jq -r '.result.submission_hash' result.json | cut -c8-19)"
          max="$(jq -r '.max_entries' "seasons/$SEASON.json")"
          {
            echo "Season \`$SEASON\` entry $seq scored on \`$challenge\`:"
            echo ""
            echo "| cases passed | charged work | program bytes |"
            echo "|---|---|---|"
            echo "| $passed / $total | $work | $bytes |"
            echo ""
            echo "Submission \`$hash…\` · entry $seq of $max allowed per entrant."
            echo "Result committed at \`season/results/$SEASON/${login}-${seq}.json\` — receipts replay independently with \`platonik season verify\`; the withheld case derivation becomes publicly checkable when the season salt is revealed at close."
            echo "Standings: https://platonik.space/lab/challenges"
          } > report.md
          gh pr comment "$PR" --body-file report.md || true
          gh pr edit "$PR" --add-label season-entered || true
          gh pr close "$PR" || true
          touch report.done

      # 8. CATCH-ALL — unexpected failures still close the loop on the PR.
      - name: Report evaluator failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          [ -f "$RUNNER_TEMP/season-stage/report.done" ] && exit 0
          [ -f report.done ] && exit 0
          {
            echo "The season evaluator could not score this entry."
            echo ""
            echo "The entry file must be valid JSON in the submission shape from [the hosted seasons doc](https://platonik.space/docs/seasons); everything else is closed unscored."
          } > report.md
          gh pr comment "$PR" --body-file report.md || true
          gh pr edit "$PR" --add-label season-error || true
          gh pr close "$PR" || true
          exit 1
