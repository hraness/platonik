name: Verification

# Kani bounded model checking on platonik-core's pure functions. Scoped to
# the crate the harnesses verify; see crates/platonik-core for properties.
on:
  pull_request:
    paths:
      - "crates/platonik-core/**"
      - ".github/workflows/verification.yml"
  push:
    branches: [main]
    paths:
      - "crates/platonik-core/**"
      - ".github/workflows/verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Kani 0.68.0
        run: |
          curl -sSfL https://github.com/model-checking/kani/releases/download/kani-0.68.0/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz -o kani.tar.gz
          tar xzf kani.tar.gz
          ./kani-0.68.0-x86_64-unknown-linux-gnu/setup.sh
      - run: cargo kani -p platonik-core -j --output-format terse
